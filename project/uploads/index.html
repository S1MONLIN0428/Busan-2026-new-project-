<style>
  /* The design is authored at 460px. Every length below is expressed in rem, so
     scaling this one value scales the entire layout uniformly — type, padding,
     gaps and grid columns alike. A uniform scale is a similarity transform, so
     line breaking is identical at every width: whatever fits on one line at
     460px fits on one line at 320px. 16px (the design value) at >=460px.
     460 * 0.034783 = 16. */
  html { font-size: clamp(7px, 3.4783vw, 16px); }
  html, body { margin: 0; padding: 0; background: #ece2cf; }
  /* Below the shell's own width there is no framing margin left, so the darker
     page ground only ever shows as a strip under short panels. Match the shell. */
  @media (max-width: 460px) {
    html, body { background: #f8f0df; }
  }
  * { box-sizing: border-box; }
  a { color: #3f5d78; text-decoration: none; }
  a:hover { color: #23201c; text-decoration: underline; }
  button { color: #23201c; font-family: inherit; -webkit-text-size-adjust: 100%; touch-action: manipulation; }
  button, [data-check], [data-fx-wrap], [data-naver] { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  [data-fx-key] { -webkit-user-select: none; user-select: none; }
  a[x-apple-data-detectors], [data-shell] a[href^="x-apple-data-detectors"] { color: inherit !important; text-decoration: none !important; font: inherit !important; }
  [data-track]::-webkit-scrollbar, [data-tabs]::-webkit-scrollbar { display: none; }
  /* Two easings for the whole page. --e decelerates hard: fast off the mark,
     long settle, which is what makes a size change read as motion rather than a
     jump. --t is for tints, where a symmetric ramp is fine. */
  :root { --e: cubic-bezier(0.32, 0.72, 0, 1); --t: cubic-bezier(0.4, 0, 0.2, 1); }
  [data-tab] { transition: background-color 200ms var(--t), color 200ms var(--t); }
  [data-check] { transition: background-color 200ms var(--t), border-color 200ms var(--t), transform 220ms var(--e); }
  [data-check]:active { transform: scale(0.88); }
  [data-time], [data-name] { transition: color 260ms var(--t); }
  [data-subs-caret], [data-day-caret], [data-pack-caret], [data-sp-caret] {
    transition: transform 320ms var(--e);
    display: inline-flex; align-items: center; justify-content: center;
    width: 12px; height: 12px; line-height: 1;
    transform-origin: 50% 50%;
  }
  /* The collapsible bodies animate their own max-height in script. The content
     slides down from a few px up as it fades, so the reveal has a direction; the
     fade is shorter so it lands before the box stops growing. */
  [data-subs], [data-day-list], [data-pack-list], [data-sp-pane] {
    overflow: hidden;
    transition: max-height 340ms var(--e), opacity 200ms var(--t), transform 340ms var(--e);
  }
  /* Same duration and easing as the collapsibles: the outer box and the list
     inside it are one movement, not two. */
  [data-track] { transition: height 340ms var(--e); }
  [data-panel] { transition: opacity 260ms var(--t); }
  /* The arriving-panel fade is a keyframe, not an inline opacity flip: an
     animation always leaves the element at its resting opacity even if frames
     are starved (backgrounded tab, locked screen), where a JS restore wouldn't.
     It starts at 0.35 rather than 0 so that even a stalled timeline leaves the
     itinerary legible instead of blank. */
  @keyframes panel-in { from { opacity: 0.35; } to { opacity: 1; } }
  [data-naver] { transition: background-color 180ms var(--t), border-color 180ms var(--t), transform 200ms var(--e); }
  [data-naver]:active { transform: scale(0.97); }
  [data-naver]:active { background-color: #e7e0d2; border-color: #a29a8e; }
  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 1ms !important; animation-duration: 1ms !important; scroll-behavior: auto !important; }
  }
  .f-kr { font-family: 'Noto Serif KR','Noto Serif','Apple SD Gothic Neo','Malgun Gothic',serif; }
  /* Everything stays on one line except addresses, which are free to wrap.
     The uniform scale above already guarantees this; nowrap is belt-and-braces
     against sub-pixel font-hinting differences at small sizes. */
  [data-shell] div, [data-shell] span, [data-shell] button { white-space: nowrap; }
  /* Must out-specify the rule above (0-1-1), hence the [data-shell] prefix. */
  [data-shell] .addr { white-space: normal; }
  @media print {
    html, body { background: #fff; }
    [data-tabs] { display: none !important; }
    [data-track] { display: block !important; overflow: visible !important; }
    [data-panel] { width: auto !important; min-width: 0 !important; height: auto !important; overflow: visible !important; break-after: page; page-break-after: always; }
    [data-panel]:last-child { break-after: auto; page-break-after: auto; }
    [data-shell] { box-shadow: none !important; max-width: none !important; }
  }
</style>

  // Every figure on the page derives from RATE, so a new rate means re-running

      var fareNt = fare * RATE;

      dSpend += spendNt;
      dFares += fareNt;
      if (!s.noCount) {
        spend += spendNt;
        fares += fareNt;
        total += spendNt + fareNt;

        ko: s.ko || '',
        addr: s.addr || '',
        hours: s.hours || '',
        meta: meta,
        metaColor: s.note ? '#6d675e' : '#8a8378',
        subs: subs,

        naverUrl: naverLink(s),

        cur = (+q[0]) * 60 + (+q[1]);

  function fxEval(src) {
    var s = String(src).replace(/[×✕]/g, '*').replace(/÷/g, '/').replace(/−/g, '-').replace(/[,\s]/g, '');

      if (peek() === '-') { i++; return -unary(); }
      if (peek() === '+') { i++; return unary(); }

        v = op === '*' ? v * r : v / r;

  function spSharesOf(e) {
    var out = {};
    var ids = Object.keys(e.parts).filter(function (id) { return spMember(id) && e.parts[id] > 0; });
    if (!ids.length) return out;
    if (e.mode === 'exact') {
      ids.forEach(function (id) { out[id] = Math.round(e.parts[id]); });
      return out;
    }
    var wsum = 0;
    ids.forEach(function (id) { wsum += e.mode === 'share' ? e.parts[id] : 1; });
    var acc = 0;
    ids.forEach(function (id, i) {
      var w = e.mode === 'share' ? e.parts[id] : 1;
      var v = i === ids.length - 1 ? e.won - acc : Math.round(e.won * w / wsum);
      acc += v;
      out[id] = v;
    });
    return out;
  }

  function spBalances() {
    var b = {};
    sp.members.forEach(function (m) { b[m.id] = { paid: 0, owed: 0 }; });
    sp.expenses.forEach(function (e) {
      var pd = spPaidOf(e);
      Object.keys(pd).forEach(function (id) { if (b[id]) b[id].paid += pd[id]; });
      var sh = spSharesOf(e);
      Object.keys(sh).forEach(function (id) { if (b[id]) b[id].owed += sh[id]; });
    });
    return b;
  }

  // Greedy largest-debtor to largest-creditor. With n people this needs at most
  // n-1 transfers, which is the fewest possible.
  function spTransfers() {
    var b = spBalances(), pos = [], neg = [];
    sp.members.forEach(function (m) {
      var n = Math.round(b[m.id].paid - b[m.id].owed);
      if (n > 0) pos.push({ id: m.id, v: n });
      else if (n < 0) neg.push({ id: m.id, v: -n });
    });
    pos.sort(function (a, c) { return c.v - a.v; });
    neg.sort(function (a, c) { return c.v - a.v; });
    var out = [], i = 0, j = 0, guard = 0;
    while (i < neg.length && j < pos.length && guard++ < 400) {
      var v = Math.min(neg[i].v, pos[j].v);
      if (v > 0) out.push({ from: neg[i].id, to: pos[j].id, won: v });
      neg[i].v -= v; pos[j].v -= v;
      if (neg[i].v <= 0) i++;
      if (pos[j].v <= 0) j++;
    }
    return out;
  }

  // ---- shared-ledger sync -------------------------------------------------
  // The unit of exchange is a delta, never the whole book: a client sends only
  // the records it changed itself. Two people adding different expenses at the
  // same moment therefore both land, and only an edit of the very same record
  // has to be resolved — the later arrival wins. The server stamps the ordering,
  // so a phone with a wrong clock cannot reorder anybody's entries.

  var spNet = { state: SP_GROUP ? 'loading' : 'local', at: 0 };
  var spInFlight = false;
  var spPushTimer = null;
  var spDeferredRepaint = false;
  // When the book last actually moved, or the user last touched the panel.
  // Polling backs off from this: see spPollPeriod.
  var spLastChange = Date.now();
  var spLastPoll = 0;
  function spTouch() { spLastChange = Date.now(); }

  function spSnap(x) { return JSON.parse(JSON.stringify(x)); }
  function spIndex(arr) {
    var o = {};
    (arr || []).forEach(function (r) { o[r.id] = r; });
    return o;
  }
  // One canonical field order, so two records can be compared as strings.
  function spExpWire(e) {
    return {
      id: e.id, title: e.title || '', won: e.won || 0,
      payers: e.payers || {}, mode: e.mode || 'even',
      parts: e.parts || {}, ts: e.ts || 0,
    };
  }

  function spDiff(base, cur) {
    var d = { changed: { members: [], expenses: [] }, deleted: { members: [], expenses: [] } };
    var bm = spIndex(base.members), cm = spIndex(cur.members);
    (cur.members || []).forEach(function (m, i) {
      var p = bm[m.id];
      if (!p || p.name !== m.name) d.changed.members.push({ id: m.id, name: m.name, ord: i });
    });
    Object.keys(bm).forEach(function (id) { if (!cm[id]) d.deleted.members.push(id); });

    var be = spIndex(base.expenses), ce = spIndex(cur.expenses);
    (cur.expenses || []).forEach(function (e) {
      var p = be[e.id];
      if (!p || JSON.stringify(spExpWire(p)) !== JSON.stringify(spExpWire(e))) {
        d.changed.expenses.push(spExpWire(e));
      }
    });
    Object.keys(be).forEach(function (id) { if (!ce[id]) d.deleted.expenses.push(id); });
    return d;
  }

  function spHasDelta(d) {
    return !!(d.changed.members.length || d.changed.expenses.length ||
              d.deleted.members.length || d.deleted.expenses.length);
  }
  function spPending() { return spDiff(spBase, sp); }

  function spApplyDelta(target, d) {
    d.changed.members.forEach(function (m) {
      var hit = null;
      target.members.forEach(function (x) { if (x.id === m.id) hit = x; });
      if (hit) hit.name = m.name;
      else target.members.push({ id: m.id, name: m.name });
    });
    d.deleted.members.forEach(function (id) {
      target.members = target.members.filter(function (x) { return x.id !== id; });
    });
    d.changed.expenses.forEach(function (e) {
      var at = -1;
      target.expenses.forEach(function (x, n) { if (x.id === e.id) at = n; });
      if (at >= 0) target.expenses[at] = spSnap(e);
      else target.expenses.unshift(spSnap(e));
    });
    d.deleted.expenses.forEach(function (id) {
      target.expenses = target.expenses.filter(function (x) { return x.id !== id; });
    });
  }

  function spUrl() { return '/api/ledger/' + encodeURIComponent(SP_GROUP); }

  function spApi(url, opts) {
    return fetch(url, {
      method: (opts && opts.method) || 'GET',
      headers: { 'Content-Type': 'application/json' },
      body: opts && opts.body,
      cache: 'no-store',
    }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
  }

  // Takes the server's answer as the new truth, then puts back anything the user
  // typed while the request was open so no keystroke is lost to a round trip.
  function spAdopt(doc, sinceBase) {
    var pending = spDiff(sinceBase || spBase, sp);
    // Somebody else moved the book: go back to checking quickly.
    if ((doc.version || 0) !== spVersion) spTouch();
    sp.members = doc.members || [];
    sp.expenses = doc.expenses || [];
    spVersion = doc.version || 0;
    spBase = spSnap({ members: sp.members, expenses: sp.expenses });
    if (spHasDelta(pending)) {
      spApplyDelta(sp, pending);
      spSchedulePush();
    }
    // A group that arrives with nobody in it is brand new: give it the A–F seed.
    if (!sp.members.length) {
      spSeed();
      spSchedulePush();
    }
    spNet.state = 'ok';
    spNet.at = Date.now();
    spCacheSave();
    spRepaintSafe();
  }

  function spFail(err) {
    spInFlight = false;
    var msg = String(err && err.message);
    // 503 is the server telling us it has no database — a setup problem, not a
    // network one, and worth saying so rather than looking like a dropped signal.
    if (msg.indexOf('503') >= 0) {
      spNet.state = 'nodb';
      spCacheSave();
      spSyncLine();
      return;
    }
    spNet.state = 'offline';
    spCacheSave();
    spSyncLine();
    if (msg.indexOf('404') >= 0) {
      spMsg = '找不到這本帳本，連結可能已失效。';
      spRepaintSafe();
    }
  }

  function spPush() {
    if (!SP_GROUP || spInFlight) return;
    var d = spPending();
    if (!spHasDelta(d)) return;
    var sent = spSnap(sp);
    spInFlight = true;
    spApi(spUrl(), { method: 'POST', body: JSON.stringify(d) })
      .then(function (doc) { spInFlight = false; spAdopt(doc, sent); })
      .catch(spFail);
  }

  function spPull() {
    if (!SP_GROUP || spInFlight) return;
    spInFlight = true;
    spApi(spUrl())
      .then(function (doc) {
        spInFlight = false;
        // Nothing moved on either side: refresh the timestamp, leave the DOM be.
        if (doc.version === spVersion && !spHasDelta(spPending())) {
          spNet.state = 'ok';
          spNet.at = Date.now();
          spSyncLine();
          return;
        }
        spAdopt(doc, spBase);
      })
      .catch(spFail);
  }

  function spSchedulePush() {
    if (!SP_GROUP) return;
    if (spPushTimer) clearTimeout(spPushTimer);
    spPushTimer = setTimeout(function () { spPushTimer = null; spPush(); }, 700);
  }

  function spTick() {
    if (!SP_GROUP || spInFlight) return;
    if (document.hidden) return;
    if (spHasDelta(spPending())) spPush();
    else spPull();
  }

  // Every poll is a server request — on a serverless host, a billed one — so the
  // rate follows what is actually happening rather than running flat out. While
  // people are entering a bill it is quick; once the book has been still for a
  // while it slows down, and a panel nobody is looking at barely checks at all.
  // Any edit, any arriving change, or a tap on the panel resets it to quick.
  function spPollPeriod() {
    if (active !== TAB_LABELS.indexOf('分帳')) return 30000;
    var idle = Date.now() - spLastChange;
    if (idle < 120000) return 4000;
    if (idle < 600000) return 10000;
    return 30000;
  }

  if (SP_GROUP && SP_CAN_SHARE) {
    setInterval(function () {
      if (document.hidden) return;
      if (Date.now() - spLastPoll < spPollPeriod()) return;
      spLastPoll = Date.now();
      spTick();
    }, 2000);
    // Coming back to the page is itself a reason to check immediately.
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) return;
      spTouch();
      spLastPoll = Date.now();
      spTick();
    });
    spLastPoll = Date.now();
    spTick();
  }

  function spSyncText() {
    // Only ever reached from file:// now — over http the book is always shared.
    if (!SP_GROUP) return '本機模式 · 只存在這台裝置';
    if (spNet.state === 'loading') return '連線中…';
    if (spNet.state === 'nodb') return '伺服器尚未連上資料庫 · 暫存本機';
    if (spNet.state === 'offline') return '離線 · 已存本機，恢復後自動同步';
    if (spNet.state === 'ok') {
      var d = new Date(spNet.at);
      return '共用中 · 同步於 ' + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
    }
    return '';
  }

  // Repainting the panel for a status change would take the caret with it, so
  // the one line that ticks on its own is updated in place.
  function spSyncLine() {
    var el = track && track.querySelector('[data-sp-sync]');
    if (!el) return;
    el.textContent = spSyncText();
    el.style.color = (spNet.state === 'offline' || spNet.state === 'nodb') ? '#a8532c' : '#8a8378';
  }

  // A remote change must never yank the field somebody is typing in. When it
  // would, the repaint is held until they leave the field.
  function spRepaintSafe() {
    var body = track && track.querySelector('[data-split-body]');
    var ae = document.activeElement;
    if (body && ae && body.contains(ae) && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA')) {
      spDeferredRepaint = true;
      spSyncLine();
      return;
    }
    spDeferredRepaint = false;
    repaintSplit();
  }

  var SP_MODES = [['even', '平均'], ['share', '份數'], ['exact', '指定金額']];
  function spModeLabel(m) {
    for (var i = 0; i < SP_MODES.length; i++) if (SP_MODES[i][0] === m) return SP_MODES[i][1];
    return m;
  }

  function spChip(attr, id, label, on) {
    return '<button type="button" ' + attr + '="' + esc(id) + '" style="border: 1px solid ' + (on ? ACCENT : '#cfc8bb') + '; background: ' + (on ? ACCENT : 'transparent') + '; color: ' + (on ? '#f8f0df' : '#3d3831') + '; border-radius: 999px; padding: 5px 11px; font-size: 12px; font-family: inherit; line-height: 1.3; cursor: pointer;">' + esc(label) + '</button>';
  }

  // Rendered whether open or closed, like every other collapsible on the page:
  // the box has to already be there for its max-height to animate. Leaving it
  // out when closed is what made this one snap open while the rest glide.
  function spMembersPane() {
    var rows = sp.members.map(function (m) {
      return '' +
        '<div style="display: grid; grid-template-columns: 1fr 20px; gap: 10px; align-items: center; padding: 7px 0; border-bottom: 1px solid #e7e3da;">' +
          '<input type="text" data-sp-name="' + esc(m.id) + '" value="' + esc(m.name) + '" style="border: 0; background: transparent; outline: none; font-family: inherit; font-size: 15px; color: #23201c; padding: 0; width: 100%;" />' +
          '<button type="button" data-sp-del-member="' + esc(m.id) + '" aria-label="刪除" style="width: 20px; height: 20px; border: 0; background: transparent; color: #b8b0a4; font-size: 15px; line-height: 1; cursor: pointer; padding: 0;">×</button>' +
        '</div>';
    }).join('');
    return '' +
      '<div data-sp-pane="members" style="display: ' + (spPane.members ? 'flex' : 'none') + '; flex-direction: column;">' + rows +
        '<div style="display: grid; grid-template-columns: 1fr; padding: 8px 0 0;">' +
          '<input type="text" data-sp-add-member="" placeholder="新增成員" style="border: 0; background: transparent; outline: none; font-family: inherit; font-size: 15px; color: #23201c; padding: 0;" />' +
        '</div>' +
      '</div>';
  }

  function spFormPane() {
    if (!spDraft) return '';
    var d = spDraft;
    var amount = fxEvalPartial(d.won);
    var wonVal = isFinite(amount) ? Math.round(amount) : 0;
    var payIds = Object.keys(d.payers).filter(function (id) { return spMember(id); });
    var payChips = sp.members.map(function (m) {
      return spChip('data-sp-payer', m.id, m.name, payIds.indexOf(m.id) >= 0);
    }).join('');
    var payRows = '';
    if (payIds.length > 1) {
      var evenEach = Math.round(wonVal / payIds.length);
      payRows = '<div style="display: flex; flex-direction: column;">' + payIds.map(function (id) {
        var v = d.payers[id] > 0 ? Math.round(d.payers[id]) : '';
        return '<div style="display: grid; grid-template-columns: 1fr 96px; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid #e7e3da;">' +
          '<div class="addr" style="font-size: 14px;">' + esc(spName(id)) + '</div>' +
          '<div style="display: flex; align-items: baseline; gap: 4px;">' +
            '<span style="font-size: 13px; color: #8a8378;">₩</span>' +
            '<input type="text" inputmode="numeric" data-sp-payer-amt="' + esc(id) + '" value="' + v + '" placeholder="' + (evenEach > 0 ? evenEach : 0) + '" style="width: 100%; min-width: 0; border: 0; background: transparent; outline: none; font-family: inherit; font-size: 14px; color: #23201c; padding: 0; text-align: right;" />' +
          '</div>' +
        '</div>';
      }).join('') +
        '<div class="addr" style="font-size: 11px; color: #8a8378; padding-top: 8px; line-height: 1.5;">空白的人平均分摊剩下的金額。</div>' +
      '</div>';
    }
    var payers = '<div style="display: flex; flex-wrap: wrap; gap: 6px;">' + payChips + '</div>' + payRows;
    var modes = SP_MODES.map(function (m) { return spChip('data-sp-mode', m[0], m[1], m[0] === d.mode); }).join('');

    var parts;
    if (d.mode === 'even') {
      parts = '<div style="display: flex; flex-wrap: wrap; gap: 6px;">' +
        sp.members.map(function (m) { return spChip('data-sp-part', m.id, m.name, d.parts[m.id] > 0); }).join('') +
        '</div>';
    } else if (d.mode === 'share') {
      parts = '<div style="display: flex; flex-direction: column;">' + sp.members.map(function (m) {
        var n = d.parts[m.id] || 0;
        return '<div style="display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid #e7e3da;">' +
          '<div class="addr" style="font-size: 14px; color: ' + (n ? '#23201c' : '#a29a8e') + ';">' + esc(m.name) + '</div>' +
          '<div style="display: flex; align-items: center; gap: 8px;">' +
            '<button type="button" data-sp-share-down="' + esc(m.id) + '" style="width: 24px; height: 24px; border: 1px solid #cfc8bb; background: transparent; border-radius: 999px; font-family: inherit; font-size: 14px; line-height: 1; color: #3d3831; cursor: pointer; padding: 0;">−</button>' +
            '<span style="font-size: 14px; min-width: 14px; text-align: center;">' + n + '</span>' +
            '<button type="button" data-sp-share-up="' + esc(m.id) + '" style="width: 24px; height: 24px; border: 1px solid #cfc8bb; background: transparent; border-radius: 999px; font-family: inherit; font-size: 14px; line-height: 1; color: #3d3831; cursor: pointer; padding: 0;">+</button>' +
          '</div>' +
        '</div>';
      }).join('') + '</div>';
    } else {
      var sum = 0;
      sp.members.forEach(function (m) { sum += d.parts[m.id] > 0 ? Math.round(d.parts[m.id]) : 0; });
      var diff = wonVal - sum;
      parts = '<div style="display: flex; flex-direction: column;">' + sp.members.map(function (m) {
        var v = d.parts[m.id] > 0 ? Math.round(d.parts[m.id]) : '';
        return '<div style="display: grid; grid-template-columns: 1fr 96px; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid #e7e3da;">' +
          '<div class="addr" style="font-size: 14px;">' + esc(m.name) + '</div>' +
          '<div style="display: flex; align-items: baseline; gap: 4px;">' +
            '<span style="font-size: 13px; color: #8a8378;">₩</span>' +
            '<input type="text" inputmode="numeric" data-sp-part-amt="' + esc(m.id) + '" value="' + v + '" placeholder="0" style="width: 100%; min-width: 0; border: 0; background: transparent; outline: none; font-family: inherit; font-size: 14px; color: #23201c; padding: 0; text-align: right;" />' +
          '</div>' +
        '</div>';
      }).join('') +
        '<div data-sp-diff="" style="font-size: 11px; color: ' + (diff === 0 ? '#8a8378' : '#a8532c') + '; padding-top: 8px;">' +
          (diff === 0 ? '已分配完畢' : (diff > 0 ? '還差 ' + won(diff) : '超出 ' + won(-diff))) +
        '</div>' +
      '</div>';
    }

    return '' +
      '<div style="border: 1px solid #cfc8bb; border-radius: 16px; background: #fdf8ee; padding: 14px; display: flex; flex-direction: column; gap: 14px;">' +
        '<input type="text" data-sp-f="title" value="' + esc(d.title) + '" placeholder="項目" style="border: 0; background: transparent; outline: none; font-family: inherit; font-size: 17px; font-weight: 600; color: #23201c; padding: 0; width: 100%;" />' +
        '<div style="display: flex; flex-direction: column; gap: 2px; border-bottom: 1px solid #ddd8ce; padding-bottom: 8px;">' +
          '<div style="display: flex; align-items: baseline; gap: 8px;">' +
            '<span style="font-size: 19px; color: #8a8378;">₩</span>' +
            '<input type="text" inputmode="decimal" data-sp-f="won" value="' + esc(d.won) + '" placeholder="0" style="flex: 1; min-width: 0; border: 0; background: transparent; outline: none; font-family: inherit; font-size: 22px; font-weight: 600; color: #23201c; padding: 0;" />' +
          '</div>' +
          '<div data-sp-won-echo="" style="min-height: 14px; font-size: 12px; color: #8a8378;">' + esc(wonVal ? '≈ ' + spNt(wonVal) : '') + '</div>' +
        '</div>' +
        '<div style="display: flex; flex-direction: column; gap: 7px;">' +
          '<div style="font-size: 11px; letter-spacing: 0.12em; color: #8a8378;">誰付的</div>' + payers +
        '</div>' +
        '<div style="display: flex; flex-direction: column; gap: 7px;">' +
          '<div style="font-size: 11px; letter-spacing: 0.12em; color: #8a8378;">怎麼分</div>' +
          '<div style="display: flex; flex-wrap: wrap; gap: 6px;">' + modes + '</div>' +
        '</div>' +
        '<div style="display: flex; flex-direction: column; gap: 7px;">' +
          '<div style="font-size: 11px; letter-spacing: 0.12em; color: #8a8378;">分給誰</div>' + parts +
        '</div>' +
        '<div style="display: flex; gap: 8px; padding-top: 2px;">' +
          '<button type="button" data-sp-save="" style="flex: 1; border: 1px solid ' + ACCENT + '; background: ' + ACCENT + '; color: #f8f0df; border-radius: 999px; padding: 10px 0; font-family: inherit; font-size: 14px; cursor: pointer;">' + (d.id ? '更新' : '記一筆') + '</button>' +
          '<button type="button" data-sp-cancel="" style="flex: 0 0 auto; border: 1px solid #cfc8bb; background: transparent; color: #3d3831; border-radius: 999px; padding: 10px 18px; font-family: inherit; font-size: 14px; cursor: pointer;">取消</button>' +
        '</div>' +
      '</div>';
  }

  function spListPane() {
    if (!sp.expenses.length) {
      return '<div class="addr" style="font-size: 13px; color: #8a8378; line-height: 1.6; padding: 4px 0 2px;">還沒有支出。</div>';
    }
    return sp.expenses.map(function (e) {
      var n = Object.keys(e.parts).filter(function (id) { return spMember(id) && e.parts[id] > 0; }).length;
      var payNames = spPayerIds(e).map(spName).join('、') || '—';
      return '' +
        '<div style="display: grid; grid-template-columns: 1fr auto 18px; gap: 10px; align-items: start; padding: 11px 0; border-bottom: 1px solid #e7e3da;">' +
          '<button type="button" data-sp-edit="' + esc(e.id) + '" style="border: 0; background: none; padding: 0; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 3px; min-width: 0;">' +
            '<span class="addr" style="font-size: 15px; font-weight: 600; line-height: 1.3; text-wrap: pretty;">' + esc(e.title || '支出') + '</span>' +
            '<span class="addr" style="font-size: 11px; color: #8a8378; line-height: 1.4;">' + esc(payNames) + ' 付 · ' + esc(spModeLabel(e.mode)) + ' · ' + n + ' 人分攤</span>' +
          '</button>' +
          '<div style="text-align: right; display: flex; flex-direction: column; gap: 2px;">' +
            '<div style="font-size: 15px; font-weight: 600;">' + esc(won(e.won)) + '</div>' +
            '<div style="font-size: 10px; color: #8a8378;">' + esc(spNt(e.won)) + '</div>' +
          '</div>' +
          '<button type="button" data-sp-del="' + esc(e.id) + '" aria-label="刪除" style="width: 18px; height: 18px; border: 0; background: transparent; color: #b8b0a4; font-size: 15px; line-height: 1; cursor: pointer; padding: 0;">×</button>' +
        '</div>';
    }).join('');
  }

  function spBalancePane() {
    var b = spBalances();
    var rows = sp.members.map(function (m) {
      var net = Math.round(b[m.id].paid - b[m.id].owed);
      var col = net > 0 ? ACCENT : (net < 0 ? '#a8532c' : '#8a8378');
      return '' +

    }).join('');
    return '' +
      '<div>' +
        '<div style="display: grid; grid-template-columns: 1fr 72px 72px 76px; gap: 6px; padding-bottom: 8px; border-bottom: 1px solid #23201c; font-size: 11px; color: #8a8378; letter-spacing: 0.06em;">' +
          '<div>成員</div><div style="text-align: right;">已付</div><div style="text-align: right;">應付</div><div style="text-align: right;">差額</div>' +
        '</div>' + rows +

  }

  function spSettlePane() {
    var t = spTransfers();
    if (!t.length) return '<div style="font-size: 13px; color: #8a8378; padding: 4px 0;">目前已結清。</div>';

          '<div class="addr" style="font-size: 14px; line-height: 1.35;">' + esc(spName(x.from)) + ' → ' + esc(spName(x.to)) + '</div>' +
          '<div style="text-align: right; display: flex; flex-direction: column; gap: 2px;">' +

  function spSectionHead(label, right, key, open) {
    return '' +

        '<span style="font-size: 11px; letter-spacing: 0.14em; color: #8a8378; flex: 1;">' + esc(label) + '</span>' +
        '<span style="font-size: 11px; color: #8a8378;">' + esc(right) + '</span>' +

  function spBody() {

    var per = sp.members.length ? total / sp.members.length : 0;
    return '' +
      '<div style="display: flex; flex-direction: column; gap: 20px;">' +

          '<div style="display: flex; flex-direction: column; gap: 2px;">' +
            '<div style="font-size: 11px; letter-spacing: 0.12em; color: #8a8378;">共同支出</div>' +
            '<div style="font-size: 22px; font-weight: 700;">' + esc(won(total)) + '</div>' +
          '</div>' +
          '<div style="text-align: right; display: flex; flex-direction: column; gap: 2px;">' +
            '<div style="font-size: 13px; color: #6d675e;">' + esc(spNt(total)) + '</div>' +
            '<div style="font-size: 11px; color: #8a8378;">' + sp.members.length + ' 人均攤 ' + esc(won(Math.round(per))) + '</div>' +
          '</div>' +
        '</div>' +
        '<div style="display: flex; align-items: center; gap: 10px;">' +
          '<span style="font-size: 11px; letter-spacing: 0.1em; color: #8a8378;">分帳匯率 ₩1 = NT$' + (Math.round(RATE * 10000) / 10000) + (rateDate ? ' · 更新於 ' + esc(rateDate) : '') + '</span>' +
          '<span style="flex: 1; height: 1px; background: #ddd8ce;"></span>' +
        '</div>' +
        (spMsg ? '<div class="addr" style="font-size: 12px; color: #a8532c; line-height: 1.5;">' + esc(spMsg) + '</div>' : '') +
        '<div style="display: flex; flex-direction: column;">' +
          spSectionHead('成員', sp.members.length + ' 人', 'members', spPane.members) +
          spMembersPane() +
        '</div>' +
        '<div style="display: flex; flex-direction: column; gap: 12px;">' +
          '<div style="display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: baseline; border-bottom: 1px solid #23201c; padding-bottom: 12px;">' +
            '<div style="font-size: 11px; letter-spacing: 0.14em; color: #8a8378;">帳目</div>' +
            (spDraft ? '<span style="font-size: 11px; color: #8a8378;">' + sp.expenses.length + ' 筆</span>' :
              '<button type="button" data-sp-new="" style="border: 1px solid ' + ACCENT + '; background: ' + ACCENT + '; color: #f8f0df; border-radius: 999px; padding: 6px 14px; font-family: inherit; font-size: 12px; cursor: pointer;">+ 記一筆</button>') +
          '</div>' +
          spFormPane() +
          '<div style="display: flex; flex-direction: column;">' + spListPane() + '</div>' +
        '</div>' +
        '<div style="display: flex; flex-direction: column; gap: 12px;">' +
          '<div style="font-size: 11px; letter-spacing: 0.14em; color: #8a8378;">結算</div>' +
          spBalancePane() +
        '</div>' +
        '<div style="display: flex; flex-direction: column; gap: 4px;">' +
          '<div style="font-size: 11px; letter-spacing: 0.14em; color: #8a8378; border-bottom: 1px solid #23201c; padding-bottom: 12px;">最少轉帳次數</div>' +
          spSettlePane() +
        '</div>' +
        // Sync state is reassurance, not something to act on, so it sits at the
        // foot of the panel rather than between the figures and the ledger.
        '<div data-sp-sync="" style="font-size: 11px; letter-spacing: 0.1em; color: ' + (spNet.state === 'offline' || spNet.state === 'nodb' ? '#a8532c' : '#8a8378') + '; padding-top: 4px;">' + esc(spSyncText()) + '</div>' +
      '</div>';
  }

  function splitPanel() {
    return '' +
      '<section data-panel="" data-screen-label="分帳" style="' + PANEL + ' display: flex; flex-direction: column; gap: 22px;">' +
        '<div style="display: flex; flex-direction: column; gap: 3px; border-bottom: 1px solid #23201c; padding-bottom: 12px;">' +
          '<div style="' + EYEBROW + '">Split</div>' +
          '<div style="font-size: 25px; font-weight: 700;">分帳</div>' +
        '</div>' +
        '<div data-split-body="">' + spBody() + '</div>' +
      '</section>';
  }

  function repaintSplit() {
    // `track` is assigned at mount; a sync response can in principle beat it.
    var box = track && track.querySelector('[data-split-body]');
    if (!box) return;
    box.innerHTML = fluid(spBody());
    fitHeight();
  }

  function spWire() {
    track.addEventListener('click', function (ev) {
      var t, i;
      // Someone is working in the panel, so keep the sync responsive even if
      // the taps have not changed anything yet.
      if (ev.target.closest && ev.target.closest('[data-split-body]')) spTouch();

      // Animate in place rather than repainting, so this opens exactly the way
      // the day, packing and sub-list sections do — same helper, same easing.
      // spPane keeps the state so a later repaint renders it open or closed.
      t = ev.target.closest('[data-sp-toggle]');
      if (t) {
        var k = t.getAttribute('data-sp-toggle');
        var pane = track.querySelector('[data-sp-pane="' + k + '"]');
        var kCaret = track.querySelector('[data-sp-caret="' + k + '"]');
        if (!pane) { spPane[k] = !spPane[k]; repaintSplit(); return; }
        var kOpen = pane.style.display === 'none';
        spPane[k] = kOpen;
        toggleBoxAndFit(pane, kOpen);
        if (kCaret) kCaret.style.transform = kOpen ? 'rotate(45deg)' : 'rotate(0deg)';
        return;
      }

      t = ev.target.closest('[data-sp-new]');
      if (t) { spDraft = spNewDraft(); spMsg = ''; repaintSplit(); return; }

      t = ev.target.closest('[data-sp-cancel]');
      if (t) { spDraft = null; spMsg = ''; repaintSplit(); return; }

      t = ev.target.closest('[data-sp-payer]');
      if (t) {
        var pyd = t.getAttribute('data-sp-payer');
        if (Object.prototype.hasOwnProperty.call(spDraft.payers, pyd)) {
          if (Object.keys(spDraft.payers).length > 1) delete spDraft.payers[pyd];
        } else {
          spDraft.payers[pyd] = null;
        }
        repaintSplit();
        return;
      }

      t = ev.target.closest('[data-sp-mode]');
      if (t) {
        var mode = t.getAttribute('data-sp-mode');
        if (mode !== spDraft.mode) {
          var amt = fxEvalPartial(spDraft.won);
          var prev = { won: isFinite(amt) ? Math.round(amt) : 0, mode: spDraft.mode, parts: spDraft.parts };
          var sh = spSharesOf(prev);
          var next = {};
          sp.members.forEach(function (m) {
            if (mode === 'exact') next[m.id] = sh[m.id] || 0;
            else next[m.id] = spDraft.parts[m.id] > 0 ? 1 : 0;
          });
          spDraft.mode = mode;
          spDraft.parts = next;
        }
        repaintSplit();
        return;
      }

      t = ev.target.closest('[data-sp-part]');
      if (t) {
        var pid = t.getAttribute('data-sp-part');
        spDraft.parts[pid] = spDraft.parts[pid] > 0 ? 0 : 1;
        repaintSplit();
        return;
      }

      t = ev.target.closest('[data-sp-share-up]');
      if (t) { var u = t.getAttribute('data-sp-share-up'); spDraft.parts[u] = (spDraft.parts[u] || 0) + 1; repaintSplit(); return; }
      t = ev.target.closest('[data-sp-share-down]');
      if (t) { var w = t.getAttribute('data-sp-share-down'); spDraft.parts[w] = Math.max(0, (spDraft.parts[w] || 0) - 1); repaintSplit(); return; }

      t = ev.target.closest('[data-sp-save]');
      if (t) {
        var d = spDraft, a = fxEvalPartial(d.won);
        var amtWon = isFinite(a) ? Math.round(a) : 0;
        var ids = sp.members.filter(function (m) { return d.parts[m.id] > 0; });
        var pids = Object.keys(d.payers).filter(function (id) { return spMember(id); });
        if (!(amtWon > 0)) { spMsg = '請輸入金額。'; repaintSplit(); return; }
        if (!pids.length) { spMsg = '請選付款人。'; repaintSplit(); return; }
        if (!ids.length) { spMsg = '至少要有一個人分攤。'; repaintSplit(); return; }
        var pfix = 0, pblank = 0;
        pids.forEach(function (id) { if (d.payers[id] > 0) pfix += Math.round(d.payers[id]); else pblank++; });
        if (!pblank && pfix !== amtWon) { spMsg = '付款人的金額加起來要等於 ' + won(amtWon) + '。'; repaintSplit(); return; }
        if (pblank && pfix > amtWon) { spMsg = '付款人的金額已經超過 ' + won(amtWon) + '。'; repaintSplit(); return; }
        if (d.mode === 'exact') {
          var s2 = 0;
          ids.forEach(function (m) { s2 += Math.round(d.parts[m.id]); });
          if (s2 !== amtWon) { spMsg = '指定金額加起來要等於 ' + won(amtWon) + '。'; repaintSplit(); return; }
        }
        var parts = {};
        ids.forEach(function (m) { parts[m.id] = d.mode === 'even' ? 1 : Math.round(d.parts[m.id]); });
        var payers = {};
        pids.forEach(function (id) { payers[id] = d.payers[id] > 0 ? Math.round(d.payers[id]) : null; });
        var rec = { id: d.id || spUid(), title: d.title.trim(), won: amtWon, payers: payers, mode: d.mode, parts: parts, ts: Date.now() };
        if (d.id) {
          sp.expenses = sp.expenses.map(function (e) { return e.id === d.id ? rec : e; });
        } else {
          sp.expenses.unshift(rec);
        }
        spSave();
        spDraft = null;
        spMsg = '';
        repaintSplit();
        return;
      }

      t = ev.target.closest('[data-sp-edit]');
      if (t) {
        var eid = t.getAttribute('data-sp-edit');
        sp.expenses.forEach(function (e) {
          if (e.id !== eid) return;
          var parts = {};
          sp.members.forEach(function (m) { parts[m.id] = e.parts[m.id] > 0 ? e.parts[m.id] : 0; });
          var payers = {};
          spPayerIds(e).forEach(function (id) { payers[id] = e.payers ? e.payers[id] : null; });
          spDraft = { id: e.id, title: e.title, won: String(e.won), payers: payers, mode: e.mode, parts: parts };
        });
        spMsg = '';
        repaintSplit();
        return;
      }

      t = ev.target.closest('[data-sp-del]');
      if (t) {
        var did = t.getAttribute('data-sp-del');
        var dExp = null;
        sp.expenses.forEach(function (e) { if (e.id === did) dExp = e; });
        // The title stays fixed and the row itself is described underneath —
        // the same summary the list shows, so you can see what you are about
        // to lose rather than matching a name against the row you tapped.
        var dNames = dExp ? (spPayerIds(dExp).map(spName).join('、') || '—') : '';
        var dCount = dExp ? Object.keys(dExp.parts).filter(function (id) {
          return spMember(id) && dExp.parts[id] > 0;
        }).length : 0;
        confirmAsk(
          '刪除「這筆支出」？',
          [
            dExp ? (dExp.title || '未命名') + ' · ' + won(dExp.won) : '',
            dExp ? dNames + ' 付 · ' + spModeLabel(dExp.mode) + ' · ' + dCount + ' 人分攤' : '',
          ],
          function () {
            sp.expenses = sp.expenses.filter(function (e) { return e.id !== did; });
            if (spDraft && spDraft.id === did) spDraft = null;
            spSave();
            repaintSplit();
          }
        );
        return;
      }

      t = ev.target.closest('[data-sp-del-member]');
      if (t) {
        var mid = t.getAttribute('data-sp-del-member');
        if (sp.members.length <= 1) { spMsg = '至少要留一位成員。'; repaintSplit(); return; }
        // Being in someone else's split is no reason to keep a member: their
        // share simply redistributes across whoever is left and the totals
        // still add up. Having PAID is different — the money they put in has
        // nowhere to go, so the books would stop balancing. That one still
        // refuses, and says why.
        var paidFor = sp.expenses.filter(function (e) { return spPayerIds(e).indexOf(mid) >= 0; }).length;
        if (paidFor) {
          spMsg = spName(mid) + ' 付過 ' + paidFor + ' 筆錢，移除的話這些錢會不見、帳就對不起來。請先改掉或刪掉那幾筆支出。';
          repaintSplit();
          return;
        }
        var sharesIn = sp.expenses.filter(function (e) { return e.parts[mid] > 0; }).length;
        confirmAsk(
          '移除成員「' + spName(mid) + '」？',
          sharesIn ? '有 ' + sharesIn + ' 筆受影響的帳目，改由其他成員負擔' : '',
          function () {
            sp.members = sp.members.filter(function (m) { return m.id !== mid; });
            if (spDraft) delete spDraft.payers[mid];
            spSave();
            spMsg = '';
            repaintSplit();
          }
        );
        return;
      }

    });

    track.addEventListener('input', function (ev) {
      var t = ev.target;
      if (!t || !t.getAttribute) return;

      if (t.hasAttribute('data-sp-name')) {
        var m = spMember(t.getAttribute('data-sp-name'));
        if (m) { m.name = t.value; spSave(); }
        return;
      }
      if (!spDraft) return;

      if (t.hasAttribute('data-sp-payer-amt')) {
        var pid2 = t.getAttribute('data-sp-payer-amt');
        var pv = t.value.replace(/[^0-9]/g, '');
        if (pv !== t.value) t.value = pv;
        spDraft.payers[pid2] = pv === '' ? null : +pv;
        return;
      }

      var f = t.getAttribute('data-sp-f');
      if (f === 'title') { spDraft.title = t.value; return; }
      if (f === 'won') {
        var raw = t.value.replace(/[^0-9.+\-*/()×÷−]/g, '');
        if (raw !== t.value) t.value = raw;
        spDraft.won = raw;
        var n = fxEvalPartial(raw);
        var echo = track.querySelector('[data-sp-won-echo]');
        if (echo) echo.textContent = isFinite(n) && n ? '≈ ' + nt(Math.round(n) * RATE) : '';
        spDiff();
        return;
      }
      if (t.hasAttribute('data-sp-part-amt')) {
        var id = t.getAttribute('data-sp-part-amt');
        var v = t.value.replace(/[^0-9]/g, '');
        if (v !== t.value) t.value = v;
        spDraft.parts[id] = v === '' ? 0 : +v;
        spDiff();
      }
    });

    // The exact-split shortfall updates as you type without repainting, so the
    // field you are in keeps focus and the caret stays put.
    function spDiff() {
      var el = track.querySelector('[data-sp-diff]');
      if (!el || !spDraft || spDraft.mode !== 'exact') return;
      var a = fxEvalPartial(spDraft.won);
      var amt = isFinite(a) ? Math.round(a) : 0;
      var sum = 0;
      sp.members.forEach(function (m) { sum += spDraft.parts[m.id] > 0 ? Math.round(spDraft.parts[m.id]) : 0; });
      var diff = amt - sum;
      el.textContent = diff === 0 ? '已分配完畢' : (diff > 0 ? '還差 ' + won(diff) : '超出 ' + won(-diff));
      el.style.color = diff === 0 ? '#8a8378' : '#a8532c';
    }

    // Repaint on blur, not on every keystroke: the figures downstream of a name
    // change, but repainting mid-word would take the caret with it.
    track.addEventListener('change', function (ev) {
      var el = ev.target;
      if (el && el.getAttribute && el.hasAttribute('data-sp-name')) repaintSplit();
    });

    // A remote update that arrived while a field had focus was held back rather
    // than stealing the caret; once focus leaves, it can land.
    track.addEventListener('focusout', function () {
      if (!spDeferredRepaint) return;
      setTimeout(function () {
        if (!spDeferredRepaint) return;
        var body = track.querySelector('[data-split-body]');
        var ae = document.activeElement;
        if (body && ae && body.contains(ae) && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA')) return;
        spDeferredRepaint = false;
        repaintSplit();
      }, 0);
    });

    track.addEventListener('keydown', function (ev) {
      if (ev.key !== 'Enter') return;
      var add = ev.target.closest ? ev.target.closest('[data-sp-add-member]') : null;
      if (!add) return;
      ev.preventDefault();
      var v = add.value.trim();
      if (!v) { add.blur(); return; }
      sp.members.push({ id: spUid(), name: v });
      if (spDraft) spDraft.parts[sp.members[sp.members.length - 1].id] = spDraft.mode === 'exact' ? 0 : 1;
      spSave();
      repaintSplit();
      var next = track.querySelector('[data-sp-add-member]');
      if (next) next.focus();
    });
  }

  // ---- mount --------------------------------------------------------------
  var nav = document.querySelector('[data-tabs]');
  var track = document.querySelector('[data-track]');

  nav.innerHTML = fluid(TAB_LABELS.map(function (label, i) {
    return '<button type="button" data-tab="' + i + '" style="flex: 0 0 auto; border: 0; background: transparent; color: #6d675e; font-size: 13px; font-weight: 500; letter-spacing: 0.03em; padding: 7px 13px; border-radius: 999px; cursor: pointer; white-space: nowrap;">' + esc(label) + '</button>';
  }).join(''));

  function paint() {
    var keep = active > 0 ? active : 0;
    track.innerHTML = fluid(
      overviewPanel() +
      days.map(dayPanel).join('') +
      converterPanel() +
      budgetPanel() +
      splitPanel() +
      packPanel()
    );
    if (keep) track.scrollLeft = track.clientWidth * keep;
    if (typeof fitHeight === 'function') fitHeight();
  }

  var tabEls = Array.prototype.slice.call(nav.querySelectorAll('[data-tab]'));
  var active = -1;

  derive();
  paint();

  // ---- weather switch -----------------------------------------------------
  var wxBar = document.querySelector('[data-wx-bar]');

  function paintWx() {
    if (!wxBar) return;
    Array.prototype.forEach.call(wxBar.querySelectorAll('[data-wx]'), function (b) {
      var on = (b.getAttribute('data-wx') === 'rain') === rainMode;
      b.style.background = on ? '#23201c' : 'transparent';
      b.style.color = on ? '#f8f0df' : '#6d675e';
    });
  }

  function setRain(next) {
    if (next === rainMode) return;
    rainMode = next;
    paintWx();
    derive();
    paint();
  }

  paintWx();

  if (wxBar) {
    wxBar.addEventListener('click', function (e) {
      var b = e.target.closest('[data-wx]');
      if (!b) return;
      var next = b.getAttribute('data-wx') === 'rain';
      // A manual tap wins for the rest of the calendar day, so the auto check
      // on the next open can't undo a decision made while standing outside.
      wxOverride = next ? 'rain' : 'sun';
      try { localStorage.setItem(WX_KEY, JSON.stringify({ mode: wxOverride, day: todayKey() })); } catch (e2) {}
      setRain(next);
    });
  }

  // Checked once per open, never on a timer. Location is asked for rather than
  // assumed; a refusal, no network or a slow fix all leave the sunny plan up.
  function detectWeather() {
    if (wxOverride || !window.fetch || !navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(function (pos) {
      var la = pos.coords.latitude.toFixed(3), lo = pos.coords.longitude.toFixed(3);
      fetch('https://api.open-meteo.com/v1/forecast?latitude=' + la + '&longitude=' + lo +
            '&current=precipitation,weather_code&daily=precipitation_probability_max' +
            '&forecast_days=1&timezone=auto', { cache: 'no-store' })
        .then(function (r) { return r.json(); })
        .then(function (j) {
          if (!j || !j.current) return;
          var code = j.current.weather_code;
          // WMO 51-67 drizzle and rain, 80-82 showers, 95-99 thunderstorm.
          var nowWet = j.current.precipitation > 0 ||
            (code >= 51 && code <= 67) || (code >= 80 && code <= 82) || (code >= 95 && code <= 99);
          var prob = (j.daily && j.daily.precipitation_probability_max || [])[0] || 0;
          setRain(nowWet || prob > 50);
        })
        .catch(function () {});
    }, function () {}, { timeout: 8000, maximumAge: 600000 });
  }
  detectWeather();

  // Daily-updated free endpoint, no key. Cached so the page is never blocked on
  // it: a failure or a plane-mode open just keeps the last known rate.
  function refreshRate() {
    if (!window.fetch) return;
    fetch('https://open.er-api.com/v6/latest/KRW', { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j || j.result !== 'success' || !j.rates) return;
        var r = j.rates.TWD;
        if (!(r > 0)) return;
        rateDate = (j.time_last_update_utc || '').slice(5, 16);
        try { localStorage.setItem(RATE_KEY, JSON.stringify({ rate: r, date: rateDate })); } catch (e) {}
        if (Math.abs(r - RATE) < 1e-9) return;
        RATE = r;
        derive();
        paint();
      })
      .catch(function () {});
  }
  refreshRate();

  // Visual only — no layout writes, so this is safe to call on every scroll
  // tick. Anything that changes geometry lives in afterSettle().
  function setActive(i) {
    if (i === active) return;
    active = i;
    tabEls.forEach(function (btn, n) {
      var on = n === i;
      btn.style.background = on ? '#23201c' : 'transparent';
      btn.style.color = on ? '#f8f0df' : '#6d675e';
    });
    // The tab strip is wider than the shell at every size, so the later tabs
    // sit off-screen at rest. Keep the active pill centred as you swipe.
    var el = tabEls[i];
    if (el && nav.scrollWidth > nav.clientWidth) {
      nav.scrollTo({
        left: Math.max(0, el.offsetLeft - (nav.clientWidth - el.offsetWidth) / 2),
        behavior: 'smooth'
      });
    }
  }

  // Runs only once the track has come to rest. Resizing the track mid-flight
  // makes Safari re-snap, which fires scroll again.
  function afterSettle(i) {
    // Panels no longer scroll internally, so arriving at one means starting the
    // page at its top.
    if (window.scrollY) window.scrollTo(0, 0);
    fitHeight();
  }

  // Instant, not smooth: a snap container cannot survive a height change while
  // an animated scroll is in flight, and afterSettle() changes the height.
  function scrollToPanel(i) {
    track.scrollLeft = track.clientWidth * i;
    setActive(i);
    afterSettle(i);
    // A tab tap jumps instantly (a snap container can't survive a height change
    // mid-animation), so the arriving panel fades in to cover the cut.
    var panel = track.children[i];
    if (panel) {
      panel.style.animation = 'none';
      void panel.offsetWidth;
      panel.style.animation = 'panel-in 260ms var(--t)';
      // setTimeout still fires in a hidden document, where the animation's own
      // timeline does not. Clearing the shorthand drops back to opacity 1.
      if (panel._fade) clearTimeout(panel._fade);
      panel._fade = setTimeout(function () {
        panel._fade = null;
        panel.style.animation = '';
      }, 400);
    }
  }

  // Collapsibles animate between 0 and their measured height, then release the
  // cap so later content changes don't get clipped.
  function toggleBox(box, open) {
    if (box._t) clearTimeout(box._t);
    var h;
    if (open) {
      box.style.display = 'flex';
      box.style.maxHeight = '0px';
      box.style.opacity = '0';
      box.style.transform = 'translateY(-6px)';
      void box.offsetHeight;
      h = box.scrollHeight;
      box.style.maxHeight = h + 'px';
      box.style.opacity = '1';
      box.style.transform = 'translateY(0)';
      box._t = setTimeout(function () { box.style.maxHeight = 'none'; }, 360);
    } else {
      h = box.scrollHeight;
      box.style.maxHeight = h + 'px';
      void box.offsetHeight;
      box.style.maxHeight = '0px';
      box.style.opacity = '0';
      box.style.transform = 'translateY(-6px)';
      box._t = setTimeout(function () { box.style.display = 'none'; }, 360);
    }
    return h;
  }

  // Grow the track at the same time as the collapsible, not after it. Waiting
  // for the list to finish made every expand read as two separate movements.
  function toggleBoxAndFit(box, open) {
    var panel = track.children[active > 0 ? active : 0];
    // Measure the panel before toggling, and measure the panel rather than the
    // track: the track may already sit a few px off its content, and inheriting
    // that error costs a second little move once fitHeight corrects it.
    var before = panel ? panel.offsetHeight : 0;
    var delta = toggleBox(box, open);
    var target = before + (open ? delta : -delta);
    track.style.height = Math.max(240, target) + 'px';
    if (track._fit) clearTimeout(track._fit);
    track._fit = setTimeout(function () { track._fit = null; fitHeight(); }, 380);
  }

  nav.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-tab]');
    if (btn) scrollToPanel(+btn.getAttribute('data-tab'));
  });

  // The track is as tall as the panel you're on, capped at the viewport, so a
  // short panel doesn't leave a stretch of empty cream below it.
  // The track is exactly as tall as the panel you're on — no viewport cap, so
  // there is no height to get wrong when the keyboard or the URL bar resizes
  // the visible area. Long panels scroll the page; short ones stay short, which
  // is what keeps a stretch of empty cream from showing below them.
  var fitting = false;
  function fitHeight() {
    if (fitting) return;
    var panel = track.children[active > 0 ? active : 0];
    if (!panel) return;
    fitting = true;
    try { measureFit(panel); } finally { fitting = false; }
  }
  function measureFit(panel) {
    var prev = track.style.height;
    track.style.height = 'auto';
    // align-items: flex-start keeps panels from stretching to the tallest one,
    // so this is the panel's own content height.
    var content = panel.offsetHeight;
    track.style.height = prev;
    void track.offsetHeight;
    track.style.height = Math.max(240, content) + 'px';
  }

  var resizeT = null;
  function refit() {
    if (resizeT) clearTimeout(resizeT);
    resizeT = setTimeout(function () { resizeT = null; fitHeight(); }, 150);
  }
  // Width changes reflow the content, which changes its height. Debounced so
  // the iOS URL-bar collapse mid-scroll can't restart a snap loop.
  window.addEventListener('resize', refit);

  function repaintPackGroup(gi) {
    var box = track.querySelector('[data-pack-group="' + gi + '"]');
    if (!box) return;
    box.innerHTML = packGroup(gi);
    var cnt = track.querySelector('[data-pack-count]');
    if (cnt) cnt.textContent = packCount();
    return box;
  }

  track.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    var add = e.target.closest ? e.target.closest('[data-pack-add]') : null;
    if (!add) return;
    e.preventDefault();
    var gi = add.getAttribute('data-pack-add');
    var val = add.value.trim();
    if (!val) { add.blur(); return; }
    custom[gi] = custom[gi] || [];
    if (custom[gi].indexOf(val) < 0) custom[gi].push(val);
    persistCustom();
    var box = repaintPackGroup(gi);
    fitHeight();
    if (box) {
      var next = box.querySelector('[data-pack-add]');
      if (next) next.focus();
    }
  });

  // The pill follows the swipe immediately (cheap, no layout writes); the
  // geometry work waits until the scroll has come to rest.
  var settle = null;
  track.addEventListener('scroll', function () {
    if (!track.clientWidth) return;
    var i = Math.round(track.scrollLeft / track.clientWidth);
    if (!Number.isFinite(i)) return;
    setActive(Math.max(0, Math.min(track.children.length - 1, i)));
    if (settle) clearTimeout(settle);
    settle = setTimeout(function () { settle = null; afterSettle(active > 0 ? active : 0); }, 180);
  }, { passive: true });

  track.addEventListener('input', function (e) {
    var f = e.target.closest ? e.target.closest('[data-fx]') : null;
    if (!f) return;
    var which = f.getAttribute('data-fx');
    var raw = f.value.replace(/[^0-9.+\-*/()×÷−]/g, '');
    if (raw !== f.value) f.value = raw;
    fxLast = which;
    fxSync(which, raw);
  });

  // Push one field's expression through to the other, and refresh both readouts.
  function fxSync(which, raw) {
    var n = fxEvalPartial(raw);
    var out = isFinite(n) ? fxFormat(which === 'krw' ? n * RATE : n / RATE) : '';
    var other = track.querySelector('[data-fx="' + (which === 'krw' ? 'twd' : 'krw') + '"]');
    if (other) other.value = out;
    if (which === 'krw') { fxKrw = raw; fxTwd = out; }
    else { fxTwd = raw; fxKrw = out; }
    var eK = track.querySelector('[data-fx-echo="krw"]');
    var eT = track.querySelector('[data-fx-echo="twd"]');
    if (eK) eK.textContent = fxEcho('₩', fxKrw);
    if (eT) eT.textContent = fxEcho('NT$', fxTwd);
  }

  track.addEventListener('click', function (e) {
    var key = e.target.closest('[data-fx-key]');
    if (key) {
      var op = key.getAttribute('data-fx-key');
      var f = track.querySelector('[data-fx="' + fxLast + '"]');
      if (!f) return;
      var v = f.value.replace(/,/g, '');
      if (op === 'clear') v = '';
      else if (op === 'back') v = v.slice(0, -1);
      else if (op === '/6') {
        v = v.replace(/[+\-*/]+$/, '').replace(/\/6$/, '').replace(/^\((.*)\)$/, '$1');
        if (v !== '') v = (/[+\-]/.test(v.slice(1)) ? '(' + v + ')' : v) + '/6';
      }
      else if (/[0-9]/.test(op)) v = v + op;
      else if (op === '.') { if (!/\.[0-9]*$/.test(v)) v = (v === '' || /[+\-*/(]$/.test(v)) ? v + '0.' : v + '.'; }
      else if (v !== '') v = /[+\-*/]$/.test(v) ? v.slice(0, -1) + op : v + op;
      f.value = v;
      fxSync(fxLast, v);
      return;
    }
    var wrap = e.target.closest('[data-fx-wrap]');
    if (wrap) {
      var which = wrap.getAttribute('data-fx-wrap');
      if (which === fxLast) return;
      fxLast = which;
      ['krw', 'twd'].forEach(function (id) {
        var w = track.querySelector('[data-fx-wrap="' + id + '"]');
        if (!w) return;
        var on = id === fxLast;
        w.style.borderColor = on ? '#23201c' : '#cfc8bb';
        w.firstChild.style.color = on ? '#3d3831' : '#8a8378';
      });
    }
  });

  track.addEventListener('click', function (e) {
    var check = e.target.closest('[data-check]');
    if (check) {
      var key = check.getAttribute('data-check');
      var on = !checked[key];
      if (on) checked[key] = 1; else delete checked[key];
      persist();
      check.setAttribute('aria-pressed', String(on));
      check.textContent = on ? '✓' : '';
      check.style.background = on ? ACCENT : 'transparent';
      check.style.borderColor = on ? ACCENT : '#c9c2b6';
      var dim = on ? '#a29a8e' : '#23201c';
      var time = track.querySelector('[data-time="' + key + '"]');
      var name = track.querySelector('[data-name="' + key + '"]');
      if (time) time.style.color = dim;
      if (name) name.style.color = dim;
      if (key.indexOf('pack:') === 0) {
        var cnt = track.querySelector('[data-pack-count]');
        if (cnt) cnt.textContent = packCount();
        var gKey = key.slice(5).split(':')[0].replace('c', '');
        var tally = track.querySelector('[data-pack-tally="' + gKey + '"]');
        if (tally) tally.textContent = packTally(gKey);
      }
      return;
    }

    var del = e.target.closest('[data-pack-del]');
    if (del) {
      var dKey = del.getAttribute('data-pack-del');
      var dGi = dKey.slice(6).split(':')[0];
      var dLabel = dKey.slice(dKey.indexOf(':', 6) + 1);
      // The packing list is this browser's own, so no note about other people.
      confirmAsk('刪除「' + dLabel + '」？', '', function () {
        custom[dGi] = (custom[dGi] || []).filter(function (x) { return x !== dLabel; });
        delete checked[dKey];
        persistCustom(); persist();
        repaintPackGroup(dGi);
        fitHeight();
      });
      return;
    }

    var subs = e.target.closest('[data-subs-toggle]');
    if (subs) {
      var sKey = subs.getAttribute('data-subs-toggle');
      var box = track.querySelector('[data-subs="' + sKey + '"]');
      var caret = subs.querySelector('[data-subs-caret]');
      var open = box.style.display === 'none';
      toggleBoxAndFit(box, open);
      caret.style.transform = open ? 'rotate(45deg)' : 'rotate(0deg)';
      return;
    }

    var packBtn = e.target.closest('[data-pack-toggle]');
    if (packBtn) {
      var pi = packBtn.getAttribute('data-pack-toggle');
      var pList = track.querySelector('[data-pack-list="' + pi + '"]');
      var pCaret = track.querySelector('[data-pack-caret="' + pi + '"]');
      var pOpen = pList.style.display === 'none';
      openPack[pi] = pOpen;
      toggleBoxAndFit(pList, pOpen);
      pCaret.style.transform = pOpen ? 'rotate(45deg)' : 'rotate(0deg)';
      return;
    }

    var dayBtn = e.target.closest('[data-day-toggle]');
    if (dayBtn) {
      var di = dayBtn.getAttribute('data-day-toggle');
      var list = track.querySelector('[data-day-list="' + di + '"]');
      var dCaret = track.querySelector('[data-day-caret="' + di + '"]');
      var dOpen = list.style.display === 'none';
      toggleBoxAndFit(list, dOpen);
      dCaret.style.transform = dOpen ? 'rotate(45deg)' : 'rotate(0deg)';
    }
  });

  spWire();
  setActive(0);
})();
</script>

</body>
</html>
